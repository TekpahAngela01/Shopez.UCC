<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCC Student Market</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .item { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .price { color: green; font-weight: bold; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>UCC Student Market</h1>
    <p>Available items for purchase:</p>

    <div class="item">
        <h2>Scientific Calculator</h2>
        <p class="price">GH₵ 150</p>
        <p>Barely used, perfect for engineering students.</p>
    </div>

    <div class="item">
        <h2>Introduction to Economics Textbook</h2>
        <p class="price">GH₵ 80</p>
        <p>Good condition, no missing pages.</p>
    </div>

    <div class="item">
        <h2>Phone Charger (Type-C)</h2>
        <p class="price">GH₵ 40</p>
        <p>Brand new, fast charging.</p>
    </div>

</body>
</html>
